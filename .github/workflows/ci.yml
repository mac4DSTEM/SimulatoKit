name: CI

# The package declares macOS 15 and iOS 18; the runner must provide an Xcode with Swift 6.2 or later (tools-version 6.2).
# macos-latest is used; the step below selects the newest Xcode installed on the image. If the image has none that builds
# the package, this job fails at `swift build` and says so (no silent skip).
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
      - name: Swift version
        run: swift --version
      # Metal suites skip themselves with a named reason when MTLCreateSystemDefaultDevice() is nil (hosted runners
      # may have no GPU); the CPU float64 reference tests always run.
      - name: Test
        run: swift test -c release
      - name: Build the libraries for iOS
        run: xcodebuild -scheme SimulatoDetector -destination 'generic/platform=iOS Simulator' -quiet build
  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
