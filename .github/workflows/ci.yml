name: CI

# The package declares macOS 15 and iOS 18 and needs Swift 6.2 or later (tools-version 6.2). The macos-26 image with
# Xcode 26.6 is pinned below, like the apps; bump it on purpose. The test job runs the tests, the consumer check (a separate
# package on the public API, and the README's quick start) and an iOS Simulator build.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like the apps: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      # Metal suites skip themselves with a named reason when MTLCreateSystemDefaultDevice() is nil (hosted runners
      # may have no GPU); the CPU float64 reference tests always run.
      - name: Test
        run: swift test -c release
      - name: Consumer check (a separate package, the public API only; then the README's quick start)
        run: tools/consumer-check/run.sh
      - name: Build the libraries for iOS
        run: xcodebuild -scheme SimulatoDetector -destination 'generic/platform=iOS Simulator' -quiet build
  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
